name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---- Job 1: 后端类型检查 ----
  server-typecheck:
    name: Server type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit

  # ---- Job 2: 后端测试（PostgreSQL 服务容器，与生产一致）----
  server-test:
    name: Server tests
    runs-on: ubuntu-latest
    needs: server-typecheck
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: music_box_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/music_box_test"
      - run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/music_box_test"
          REDIS_URL: "redis://localhost:6379"
          JWT_SECRET: "ci-only-jwt-secret-0123456789abcdef0123456789abcdef"

  # ---- Job 3: 前端构建（web / browse）----
  web-build:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web
        working-directory: web
        run: npm ci && npm run build
      - name: Build browse
        working-directory: web/browse
        run: npm ci && npm run build

  # ---- Job 4: Docker 镜像构建（仅 main 推送时）----
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [server-typecheck, web-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: api-runtime
          push: false
          tags: music-box-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: web-runtime
          push: false
          tags: music-box-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
