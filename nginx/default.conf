server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # ---- API 反向代理 ----
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---- 健康检查 ----
    location /health {
        proxy_pass http://api:3000/health;
        proxy_set_header Host $host;
    }

    # ---- Web 主站 ----
    location / {
        root /usr/share/nginx/html/web;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ---- Admin 管理后台 ----
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # ---- Browse 浏览页 ----
    location /browse/ {
        alias /usr/share/nginx/html/browse/;
        index index.html;
        try_files $uri $uri/ /browse/index.html;
    }

    # ---- 主站静态资源（vite 产物 /assets/*）----
    # 必须用 ^~ 前缀匹配并优先于下方正则 location：
    # 主站文件位于 html/web/assets/，若被下方正则（root=html/）截获会全部 404
    location ^~ /assets/ {
        root /usr/share/nginx/html/web;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---- 其他静态资源缓存 (30天) ----
    # admin/browse 的资源 URI 前缀（/admin/assets/*、/browse/assets/*）
    # 与 html/ 下实际目录一致，root=html/ 即可正确命中
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|mp3|mp4)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
