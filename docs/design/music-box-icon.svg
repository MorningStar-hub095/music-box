  </defs>

  <!-- 圆角矩形背景 -->
  <rect width="512" height="512" rx="112" fill="url(#bgIcon)"/>

  <!-- 同心圆声波 -->
  <g fill="none" stroke="#17C3B2">
    <circle cx="256" cy="230" r="40" stroke-width="1" opacity="0.15"/>
    <circle cx="256" cy="230" r="70" stroke-width="1" opacity="0.12"/>
    <circle cx="256" cy="230" r="105" stroke-width="1" opacity="0.09"/>
    <circle cx="256" cy="230" r="145" stroke-width="1" opacity="0.06"/>
  </g>

  <!-- 频谱柱 -->
  <g fill="#17C3B2" opacity="0.5">
    <rect x="130" y="360" width="5" height="20" rx="2.5"/>
    <rect x="142" y="345" width="5" height="35" rx="2.5"/>
    <rect x="154" y="330" width="5" height="50" rx="2.5"/>
    <rect x="166" y="315" width="5" height="65" rx="2.5"/>
    <rect x="178" y="300" width="5" height="80" rx="2.5"/>
    <rect x="190" y="285" width="5" height="95" rx="2.5"/>
    <rect x="202" y="270" width="5" height="110" rx="2.5"/>
    <rect x="214" y="290" width="5" height="90" rx="2.5"/>
    <rect x="226" y="310" width="5" height="70" rx="2.5"/>
    <rect x="238" y="270" width="5" height="110" rx="2.5"/>
    <rect x="250" y="240" width="5" height="140" rx="2.5"/>
    <rect x="262" y="220" width="5" height="160" rx="2.5"/>
    <rect x="274" y="200" width="5" height="180" rx="2.5"/>
    <rect x="286" y="185" width="5" height="195" rx="2.5"/>
    <rect x="298" y="200" width="5" height="180" rx="2.5"/>
    <rect x="310" y="220" width="5" height="160" rx="2.5"/>
    <rect x="322" y="240" width="5" height="140" rx="2.5"/>
    <rect x="334" y="270" width="5" height="110" rx="2.5"/>
    <rect x="346" y="290" width="5" height="90" rx="2.5"/>
    <rect x="358" y="310" width="5" height="70" rx="2.5"/>
    <rect x="370" y="330" width="5" height="50" rx="2.5"/>
    <rect x="382" y="345" width="5" height="35" rx="2.5"/>
  </g>

  <!-- 频谱柱高光 -->
  <g fill="#FFD60A" opacity="0.8">
    <rect x="286" y="185" width="5" height="6" rx="2.5"/>
    <rect x="274" y="200" width="5" height="6" rx="2.5"/>
    <rect x="298" y="200" width="5" height="6" rx="2.5"/>
  </g>

  <!-- 中心核心 -->
  <circle cx="256" cy="230" r="30" fill="url(#coreIcon)"/>
  <circle cx="256" cy="230" r="30" fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.3"/>

  <!-- 音符 -->
  <text x="256" y="242" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#FFFFFF" opacity="0.95">♪</text>
