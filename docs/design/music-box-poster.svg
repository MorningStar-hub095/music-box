<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#1A1F2E"/>
      <stop offset="100%" stop-color="#0F1419"/>
    </radialGradient>
    <radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="1"/>
      <stop offset="60%" stop-color="#17C3B2" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F9B8E" stop-opacity="0.3"/>
    </radialGradient>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD60A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFD60A" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="800" fill="url(#bgGrad)"/>

  <!-- 同心圆声波 -->
  <g fill="none" stroke="#17C3B2" stroke-width="0.8">
    <circle cx="400" cy="360" r="60" opacity="0.15"/>
    <circle cx="400" cy="360" r="100" opacity="0.12"/>
    <circle cx="400" cy="360" r="145" opacity="0.10"/>
    <circle cx="400" cy="360" r="195" opacity="0.08"/>
    <circle cx="400" cy="360" r="250" opacity="0.06"/>
    <circle cx="400" cy="360" r="310" opacity="0.04"/>
  </g>

  <!-- 频谱柱（底部） -->
  <g fill="#17C3B2" opacity="0.6">
    <rect x="180" y="560" width="6" height="40" rx="3"/>
    <rect x="196" y="540" width="6" height="60" rx="3"/>
    <rect x="212" y="520" width="6" height="80" rx="3"/>
    <rect x="228" y="500" width="6" height="100" rx="3"/>
    <rect x="244" y="480" width="6" height="120" rx="3"/>
    <rect x="260" y="460" width="6" height="140" rx="3"/>
    <rect x="276" y="440" width="6" height="160" rx="3"/>
    <rect x="292" y="460" width="6" height="140" rx="3"/>
    <rect x="308" y="480" width="6" height="120" rx="3"/>
    <rect x="324" y="440" width="6" height="160" rx="3"/>
    <rect x="340" y="400" width="6" height="200" rx="3"/>
    <rect x="356" y="370" width="6" height="230" rx="3"/>
    <rect x="372" y="350" width="6" height="250" rx="3"/>
    <rect x="388" y="330" width="6" height="270" rx="3"/>
    <rect x="404" y="310" width="6" height="290" rx="3"/>
    <rect x="420" y="330" width="6" height="270" rx="3"/>
    <rect x="436" y="350" width="6" height="250" rx="3"/>
    <rect x="452" y="370" width="6" height="230" rx="3"/>
    <rect x="468" y="400" width="6" height="200" rx="3"/>
    <rect x="484" y="440" width="6" height="160" rx="3"/>
    <rect x="500" y="460" width="6" height="140" rx="3"/>
    <rect x="516" y="480" width="6" height="120" rx="3"/>
    <rect x="532" y="440" width="6" height="160" rx="3"/>
    <rect x="548" y="460" width="6" height="140" rx="3"/>
    <rect x="564" y="480" width="6" height="120" rx="3"/>
    <rect x="580" y="500" width="6" height="100" rx="3"/>
    <rect x="596" y="520" width="6" height="80" rx="3"/>
    <rect x="612" y="540" width="6" height="60" rx="3"/>
  </g>

  <!-- 频谱柱高光 -->
  <g fill="#FFD60A" opacity="0.7">
    <rect x="404" y="310" width="6" height="8" rx="3"/>
    <rect x="388" y="330" width="6" height="8" rx="3"/>
    <rect x="420" y="330" width="6" height="8" rx="3"/>
  </g>

  <!-- 中心核心 -->
  <circle cx="400" cy="360" r="42" fill="url(#coreGrad)"/>
  <circle cx="400" cy="360" r="42" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.3"/>

  <!-- 音符符号 -->
  <text x="400" y="375" text-anchor="middle" font-family="Georgia, serif" font-size="36" fill="#FFFFFF" opacity="0.95">♪</text>

  <!-- 十字准线 -->
  <g stroke="#17C3B2" stroke-width="0.5" opacity="0.3">
    <line x1="400" y1="100" x2="400" y2="200"/>
    <line x1="400" y1="520" x2="400" y2="620"/>
    <line x1="150" y1="360" x2="250" y2="360"/>
    <line x1="550" y1="360" x2="650" y2="360"/>
  </g>

  <!-- 角标参考线 -->
  <g stroke="#2A2F3E" stroke-width="0.5" opacity="0.5">
    <line x1="60" y1="60" x2="100" y2="60"/>
    <line x1="60" y1="60" x2="60" y2="100"/>
    <line x1="740" y1="60" x2="700" y2="60"/>
    <line x1="740" y1="60" x2="740" y2="100"/>
    <line x1="60" y1="740" x2="100" y2="740"/>
    <line x1="60" y1="740" x2="60" y2="700"/>
    <line x1="740" y1="740" x2="700" y2="740"/>
    <line x1="740" y1="740" x2="740" y2="700"/>
  </g>

  <!-- 标题 -->
  <text x="400" y="680" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="300" fill="#FFFFFF" letter-spacing="8">MUSIC BOX</text>

  <!-- 副标题 -->
  <text x="400" y="708" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#A0A0A0" letter-spacing="4">SONIC RESONANCE · 2026</text>

  <!-- 技术标注 -->
  <text x="60" y="770" font-family="'Courier New', monospace" font-size="9" fill="#6B7280" letter-spacing="1">FREQ: 440Hz</text>
  <text x="740" y="770" text-anchor="end" font-family="'Courier New', monospace" font-size="9" fill="#6B7280" letter-spacing="1">PLATE 001</text>
</svg>
