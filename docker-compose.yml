services:
  # ---- PostgreSQL 数据库（与 server/prisma/schema.prisma 的 provider 一致）----
  postgres:
    image: postgres:16-alpine
    container_name: music-box-postgres
    restart: unless-stopped
    environment:
      # 强制要求：发布仓库中的默认密码 = 人人皆知，必须由部署者通过 .env 提供
      # 用法：cp .env.docker.example .env 后修改，再 docker compose up -d
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在项目根目录 .env 中设置 POSTGRES_PASSWORD（参考 .env.docker.example）}
      POSTGRES_DB: music_box
    ports:
      # 仅绑定本机回环地址，避免数据库暴露到公网
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d music_box"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---- API 服务 ----
  # 注：缓存层已于 2026-08-15 从 Redis 迁移为进程内 Map（server/src/lib/redis.ts），
  # 不再需要 Redis 容器；如未来迁回，恢复本注释以下的原 redis 服务定义即可。
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-runtime
    container_name: music-box-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:?请在项目根目录 .env 中设置 POSTGRES_PASSWORD}@postgres:5432/music_box"
      # 32+ 字符强密钥：低于 32 字符会被 server/src/config.ts 的 fail-fast 校验拒绝启动
      JWT_SECRET: ${JWT_SECRET:?请在项目根目录 .env 中设置 JWT_SECRET（至少32字符随机串，参考 .env.docker.example）}
      ALLOWED_ORIGINS: "http://localhost,http://localhost:80"
      LOG_DIR: "/app/server/logs"
      # 公网演示部署请设为 true：关闭第三方音频播放/缓存（版权合规），
      # 唯一音频来源变为 local-music 卷内的自有版权曲库（见 local-music/README.md）
      DEMO_MODE: ${DEMO_MODE:-false}
      LOCAL_MUSIC_DIR: /app/server/local-music
    ports:
      # nginx 容器经内部网络访问 api:3000；宿主映射仅供本机调试
      - "127.0.0.1:3000:3000"
    # 资源限制：防止内存无限增长耗尽宿主资源后被 OOM 杀死
    mem_limit: 2g
    cpus: 1.0
    # 日志持久化（服务崩溃后可查看日志文件追溯根因）
    volumes:
      - api_logs:/app/server/logs
      # 自有版权曲库（只读挂载；放入音频并配好 library.json 即生效）
      - ./local-music:/app/server/local-music:ro
    # 健康检查：容器内 node 18 自带 fetch，探测 /api/health
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---- Web 前端 (Nginx) ----
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web-runtime
    container_name: music-box-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  postgres_data:
  api_logs:
